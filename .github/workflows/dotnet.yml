# This workflow will build the .NET 10 project and verify the build

name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore server-dotnet/server-dotnet.csproj
    - name: Build
      run: dotnet build server-dotnet/server-dotnet.csproj --no-restore
